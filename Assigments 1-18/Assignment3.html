<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    /* Outer container box */
    .container {
      border: 1px solid #99c2a2;
      padding: 25px 50px;
      margin-top: 5px;
    }

    /* Block elements take up the full width and stack vertically */
    .block-item {
      background-color: #add8e6; /* Light blue */
      margin-bottom: 8px;
      padding: 2px 4px;
    }

    /* Inline elements only take up as much width as their content */
    .inline-item {
      background-color: #90ee90; /* Light green */
      padding: 2px 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Block Elements -->
    <div class="block-item">Block 1</div>
    <div class="block-item">Block 2</div>

    <!-- Inline Elements -->
    <span class="inline-item">Inline 1</span>
    <span class="inline-item">Inline 2</span>
    <span class="inline-item">Inline 3</span>
  </div>

</body>
</html>
